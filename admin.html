<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doce Encomenda - Painel da Confeiteira (Admin)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e77d68;
      --accent: #ffad91;
      --bg-off: #171327;
      --card-bg: rgba(35, 28, 53, 0.82);
      --ok: #8bd9c1;
      --bad: #f47d9b;
      --ink-soft: #b9b1c9;
      --line: rgba(255, 255, 255, 0.11);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-off);
      background-image:
        radial-gradient(circle at 8% 0%, rgba(231, 125, 104, 0.22), transparent 31rem),
        radial-gradient(circle at 92% 12%, rgba(139, 217, 193, 0.12), transparent 28rem),
        linear-gradient(135deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(45deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: auto, auto, 36px 36px, 36px 36px;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 18px 45px rgba(9, 5, 20, 0.24);
    }

    .glass-input {
      background: rgba(18, 13, 12, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }
    .glass-input:focus {
      border-color: var(--accent);
      background: rgba(25, 17, 15, 0.96);
      box-shadow: 0 0 0 3px rgba(241, 160, 126, 0.16);
      outline: none;
    }

    header.glass-panel {
      background: rgba(23, 19, 39, 0.88);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .card-touch {
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
    }
    .card-touch:hover {
      box-shadow: 0 10px 24px rgba(9, 5, 4, 0.2);
    }

    main {
      animation: admin-enter 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    #gridKanban > div {
      min-width: 0;
    }

    @keyframes admin-enter {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 767px) {
      body { padding-bottom: 1.5rem; }
      header.glass-panel { padding: 0.8rem 1rem; }
      header .text-2xl { font-size: 1.5rem; }
      header button { min-height: 2.75rem; }
      main { padding: 1rem; gap: 1.25rem; }
      main > section:first-child { gap: 0.55rem; }
      main > section:first-child > div { padding: 0.85rem; border-radius: 1.1rem; }
      main > section:first-child > div:nth-child(2) { grid-column: span 2; }
      main > section:nth-child(2) { padding: 0.85rem; }
      #gridKanban {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        gap: 0.75rem;
        padding: 0.15rem 0.1rem 0.6rem;
        scrollbar-width: none;
      }
      #gridKanban::-webkit-scrollbar { display: none; }
      #gridKanban > div {
        flex: 0 0 min(84vw, 20rem);
        min-height: 26rem;
        scroll-snap-align: start;
      }
    }

    .card-touch {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card-touch:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col antialiased selection:bg-[#E29578] selection:text-slate-950">

  <!-- BARRA SUPERIOR (HEADER ADMIN) -->
  <header class="glass-panel sticky top-0 z-40 border-b border-white/5 px-4 lg:px-8 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-2xl">👩‍🍳</span>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base font-extrabold text-white tracking-tight">Doce Encomenda</h1>
          <span class="px-2 py-0.5 rounded-full bg-[#8C4A32]/40 text-[#E29578] text-[10px] font-bold border border-[#E29578]/30">PAINEL ADMIN</span>
        </div>
        <p class="text-[11px] text-slate-400">Controle de Produção & Caixa</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="abrirModalCompras()" class="px-3 py-1.5 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 text-xs font-bold border border-amber-500/30 card-touch flex items-center gap-1">
        <span>🛒</span> Lista de Compras (JIT)
      </button>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8 space-y-6">

    <!-- MÉTRICAS DO DIA -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-3 lg:gap-4">
      <div class="glass-panel p-4 rounded-2xl border border-white/5">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Retiradas Hoje</span>
        <div class="flex items-baseline gap-2 mt-1">
          <span id="metricaRetiradas" class="text-2xl font-extrabold text-white">0</span>
          <span class="text-xs text-slate-400">pedidos</span>
        </div>
      </div>

      <div class="glass-panel p-4 rounded-2xl border border-white/5">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Caixa Previsto (Saldos)</span>
        <div class="flex items-baseline gap-2 mt-1">
          <span id="metricaCaixa" class="text-2xl font-extrabold text-[--ok]">R$ 0,00</span>
        </div>
      </div>

      <div class="glass-panel p-4 rounded-2xl border border-white/5">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Em Produção</span>
        <div class="flex items-baseline gap-2 mt-1">
          <span id="metricaProducao" class="text-2xl font-extrabold text-[#E29578]">0</span>
          <span class="text-xs text-slate-400">bolos</span>
        </div>
      </div>

      <div class="glass-panel p-4 rounded-2xl border border-white/5">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Próxima Retirada</span>
        <div class="truncate mt-1">
          <span id="metricaProximo" class="text-sm font-bold text-slate-200">Nenhum</span>
        </div>
      </div>
    </section>

    <!-- FILTROS & AÇÕES -->
    <section class="glass-panel p-4 rounded-2xl border border-white/5 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <input type="date" id="filtroDataAdmin" onchange="carregarPedidosAdmin()" class="glass-input p-2.5 rounded-xl text-xs font-semibold outline-none cursor-pointer">
        <button onclick="definirDataHoje()" class="px-3 py-2 rounded-xl bg-[#8C4A32]/30 text-[#E29578] text-xs font-bold border border-[#E29578]/30 card-touch">Hoje</button>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="abrirModalBalcao()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-[#8C4A32] to-[#E29578] text-slate-950 font-extrabold text-xs shadow-md card-touch flex items-center gap-1.5">
          <span>+</span> Novo Pedido Balcão
        </button>
      </div>
    </section>

    <!-- ESTEIRA DE PRODUÇÃO (KANBAN) -->
    <section class="space-y-3">
      <h2 class="text-xs font-bold text-[#E29578] uppercase tracking-wider">Esteira de Produção & Pedidos</h2>
      
      <div id="gridKanban" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <!-- Colunas geradas dinamicamente via admin.js -->
      </div>
    </section>

  </main>

  <!-- MODAL: LISTA DE COMPRAS JIT -->
  <div id="modalCompras" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
    <div class="glass-panel p-6 rounded-3xl max-w-md w-full border border-white/10 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-white/10">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <span>🛒</span> Lista de Compras (Próximos 7 Dias)
        </h3>
        <button onclick="fecharModalCompras()" class="text-slate-400 hover:text-white p-1">✕</button>
      </div>

      <div id="listaIngredientesJIT" class="space-y-2 text-xs text-slate-300 max-h-60 overflow-y-auto no-scrollbar">
        <!-- Itens calculados dinamicamente -->
      </div>

      <button onclick="fecharModalCompras()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs card-touch">
        Fechar
      </button>
    </div>
  </div>

  <!-- MODAL: NOVO PEDIDO BALCÃO -->
  <div id="modalBalcao" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
    <div class="glass-panel p-6 rounded-3xl max-w-md w-full border border-white/10 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-white/10">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <span>➕</span> Novo Pedido Manual (Balcão/Zap)
        </h3>
        <button onclick="fecharModalBalcao()" class="text-slate-400 hover:text-white p-1">✕</button>
      </div>

      <form id="formBalcao" onsubmit="salvarPedidoBalcao(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Nome do Cliente</label>
          <input type="text" id="bNome" required placeholder="Ex: Ana Souza" class="w-full glass-input p-3 rounded-xl text-xs outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">WhatsApp</label>
          <input type="tel" id="bFone" required placeholder="(11) 99999-9999" class="w-full glass-input p-3 rounded-xl text-xs outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Produto</label>
          <select id="bProduto" class="w-full glass-input p-3 rounded-xl text-xs outline-none bg-slate-900 text-white">
            <option value="Bolo Clássico 1.5kg">Bolo Clássico 1.5kg (R$ 120,00)</option>
            <option value="Bolo Red Velvet">Bolo Red Velvet (R$ 140,00)</option>
            <option value="Cento de Brigadeiros Tradicionais">Cento de Brigadeiros (R$ 90,00)</option>
            <option value="Combo Festa">Combo Festa (R$ 170,00)</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Data de Retirada</label>
            <input type="date" id="bData" required class="w-full glass-input p-3 rounded-xl text-xs outline-none cursor-pointer">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Janela</label>
            <select id="bJanela" class="w-full glass-input p-3 rounded-xl text-xs outline-none bg-slate-900 text-white">
              <option value="Manhã (09h - 12h)">Manhã (09h - 12h)</option>
              <option value="Tarde (14h - 17h)">Tarde (14h - 17h)</option>
            </select>
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-[#8C4A32] to-[#E29578] text-slate-950 font-extrabold rounded-xl text-xs shadow-md card-touch mt-2">
          Salvar Pedido na Esteira
        </button>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
